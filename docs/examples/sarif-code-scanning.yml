# Upload TrustBridge SARIF to GitHub code scanning (Issue #959).
# Troubleshooting: docs/TROUBLESHOOTING.md#sarif-upload-failures
name: TrustBridge SARIF
on:
  issues:
    types: [assigned]
permissions:
  contents: read
  issues: write
  security-events: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: Stellar-TrustBridge/trustbridge-action@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          sarif_output_path: trustbridge-results.sarif
      - name: Upload SARIF
        if: always() && hashFiles('trustbridge-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trustbridge-results.sarif
          category: trustbridge
