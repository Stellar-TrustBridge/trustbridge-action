# Batch stellar_addresses example
#
# Demonstrates onboarding many Stellar addresses in a single action run using
# the `stellar_addresses` input (newline-separated list) combined with
# `assets_json` (per-asset metadata map), then consuming the
# `batch_summary_json` output in a downstream job.
#
# Input format reference: see the "Batch mode" section of docs/USAGE.md.
# Failure-mode behavior mirrors __tests__/batch.test.ts (deduplication of
# duplicate addresses, and an error when the address list is empty).

name: Batch stellar_addresses

on:
  workflow_dispatch:
    inputs:
      horizon_url:
        description: Horizon endpoint (testnet by default)
        required: false
        default: https://horizon-testnet.stellar.org
      stellar_addresses:
        description: |
          Newline-separated Stellar addresses (one per line).
          Blank lines are ignored; duplicate addresses are deduplicated
          before processing (see batch.test.ts). An empty list is an error.
        required: true
        type: string

permissions:
  contents: read

jobs:
  batch:
    runs-on: ubuntu-latest
    outputs:
      # batch_summary_json is a JSON string emitted by the action. Downstream
      # jobs read it via needs.<job>.outputs.batch_summary_json.
      batch_summary_json: ${{ steps.run.outputs.batch_summary_json }}
    steps:
      - name: Run batch onboarding
        id: run
        uses: trustbridge/trustbridge-action@v1
        with:
          # Newline-separated list. Keep each address on its own line; the
          # action splits on newlines and deduplicates repeated entries.
          stellar_addresses: ${{ inputs.stellar_addresses }}
          # Per-asset metadata map keyed by asset code.
          assets_json: |
            {
              "USDC": { "issuer": "GBBD47IF6LWK7P7MDEVSCWR7DPUWV3NY3DTQEVFL4NAT4AQH3ZLLFLA5" },
              "XLM": { "native": true }
            }
          horizon_url: ${{ inputs.horizon_url }}

  summarize:
    needs: batch
    runs-on: ubuntu-latest
    steps:
      - name: Interpret batch_summary_json
        env:
          # High-level shape: { total, succeeded, failed, results: [...] }
          # where each result entry carries the address and per-address status.
          BATCH_SUMMARY_JSON: ${{ needs.batch.outputs.batch_summary_json }}
        run: |
          echo "$BATCH_SUMMARY_JSON" | jq '{total, succeeded, failed}'
          echo "$BATCH_SUMMARY_JSON" | jq -r '.results[] | "\(.address): \(.status)"'
