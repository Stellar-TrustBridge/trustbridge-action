# Example workflow: extract a Stellar address submitted via the
# "Wallet onboarding" Issue Form (docs/examples/wallet-issue-form.yml) and
# feed it into trustbridge-action.
#
# See docs/USAGE.md#extracting-stellar-addresses-from-issue-forms for the
# full explanation, including why this matches on the field *label* rather
# than the form's `id`, and how missing/invalid fields are handled.

name: Verify wallet from issue form

on:
  issues:
    types: [assigned]

jobs:
  extract-and-verify:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read
    steps:
      - name: Extract Stellar address from issue form
        id: extract
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          script: |
            const body = context.payload.issue?.body ?? '';

            // Issue Forms render to a fixed Markdown body: each field
            // becomes "### <label>" followed by a blank line and the
            // answer (or "_No response_" if an optional field was left
            // blank). There is no JSON/structured API for form answers —
            // only this composited Markdown body — so match on the label
            // text you configured in the form's `label:` attribute, not
            // the form's `id:` (the id never appears in the rendered body).
            const FIELD_LABEL = 'Stellar wallet address';
            const headingRe = new RegExp(
              `### ${FIELD_LABEL}\\s*\\n+([\\s\\S]*?)(?:\\n### |$)`,
            );
            const match = body.match(headingRe);
            const raw = match ? match[1].trim() : '';

            if (!raw || raw === '_No response_') {
              core.setFailed(
                `Could not find a "${FIELD_LABEL}" answer in the issue body. ` +
                `Make sure this issue was created from the wallet onboarding form.`,
              );
              return;
            }

            // Defense in depth: the form's `required: true` guarantees a
            // non-empty answer, but not that it's shaped like a Stellar
            // G-address (users can paste anything into a text field).
            const addressMatch = raw.match(/^(G[A-Z2-7]{55})$/);
            if (!addressMatch) {
              core.setFailed(
                `The "${FIELD_LABEL}" value does not look like a Stellar G-address: "${raw}"`,
              );
              return;
            }

            core.setOutput('address', addressMatch[1]);

      - name: TrustBridge check
        if: steps.extract.outputs.address
        uses: Stellar-TrustBridge/trustbridge-action@07b97d28d482a18d277285f980dd5d7206673eb5 # v1.4.0 — see note in trustbridge-label-gate.yml
        with:
          stellar_address_input: ${{ steps.extract.outputs.address }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
