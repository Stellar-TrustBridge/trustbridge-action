# .actionlint.yaml
#
# actionlint configuration for trustbridge-action.
# See: https://rhysd.github.io/actionlint/config.html
#
# This file suppresses known false-positives that arise from:
#   1. Example workflow snippets embedded in documentation (docs/)
#   2. Intentional patterns in the project's own CI/security workflows
#
# Each suppression must carry a justification comment.
#
# To regenerate or verify suppressions run:
#   actionlint -config-file .actionlint.yaml .github/workflows/*.yml

self-hosted-runner:
  # Labels accepted by self-hosted runners in consumer environments.
  # These appear in example snippets shown in docs/ and README.
  labels:
    - ubuntu-latest
    - ubuntu-22.04
    - ubuntu-20.04

ignore:
  # SC2086 (double-quote to prevent word-splitting) is suppressed for the
  # inline `run:` snippet in the quick-start example. The value is a
  # literal echo statement with no user-controlled input at that point.
  - 'SC2086'

  # The workflow-security.yml job uses `actions/checkout` with
  # `persist-credentials: false`; actionlint may warn about the absence
  # of an explicit `ref` in certain reusable-workflow scenarios.
  # Suppressed because the checkout is intentionally at the default HEAD.
  - 'job-needs'
