name: Refresh dist (Linux)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh-dist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Commit refreshed dist if needed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A dist
          if git diff --cached --quiet; then
            echo "dist already matches Linux build"
            exit 0
          fi
          git commit -m "chore: refresh dist from Linux CI build"
          git push origin HEAD:${{ github.ref_name }}
