# Reusable TrustBridge status check. Call from consumer repos via workflow_call.
# Full input matrix and usage notes: docs/USAGE.md and docs/examples/.

name: TrustBridge Reusable Check

on:
  workflow_call:
    inputs:
      stellar_address_input:
        description: Stellar account address (G-address) to validate
        required: false
        type: string
        default: ""
      horizon_url:
        description: Stellar Horizon API base URL
        required: false
        type: string
        default: "https://horizon.stellar.org"
      asset_code:
        description: Asset code to check trustline for
        required: false
        type: string
        default: "USDC"
      asset_issuer:
        description: Asset issuer Stellar address
        required: false
        type: string
        default: "GA5ZSEJYB37JRC5AVCIA5MOP4RHTM335X2KGX3IHOJAPP5RE34K4KZVN"
      min_xlm_reserve:
        description: Minimum native XLM balance required
        required: false
        type: string
        default: "1.5"
      fail_on_missing:
        description: Fail the workflow step when checks do not pass
        required: false
        type: boolean
        default: true
      comment_mode:
        description: Comment posting mode (post, dry-run, or off)
        required: false
        type: string
        default: "dry-run"
    secrets:
      github_token:
        description: GitHub token with required permissions
        required: false
    outputs:
      ready:
        description: Whether all validation checks passed
        value: ${{ jobs.trustbridge-check.outputs.ready }}
      reason_code:
        description: Machine-readable result code
        value: ${{ jobs.trustbridge-check.outputs.reason_code }}

jobs:
  trustbridge-check:
    name: TrustBridge Status Check
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read
      pull-requests: read
    outputs:
      ready: ${{ steps.trustbridge.outputs.ready }}
      reason_code: ${{ steps.trustbridge.outputs.reason_code }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Run TrustBridge Action
        id: trustbridge
        uses: ./
        with:
          stellar_address_input: ${{ inputs.stellar_address_input }}
          github_token: ${{ secrets.github_token || github.token }}
          horizon_url: ${{ inputs.horizon_url }}
          asset_code: ${{ inputs.asset_code }}
          asset_issuer: ${{ inputs.asset_issuer }}
          min_xlm_reserve: ${{ inputs.min_xlm_reserve }}
          fail_on_missing: ${{ inputs.fail_on_missing }}
          comment_mode: ${{ inputs.comment_mode }}
