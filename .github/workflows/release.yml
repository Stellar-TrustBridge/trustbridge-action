name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20

      - name: Verify action bundle
        run: |
          test -f action.yml
          test -f dist/index.js
          test -f dist/dist-manifest.json

      - name: Verify dist/index.js SHA-256 matches dist-manifest.json
        # Re-computes the SHA-256 of the committed dist/index.js and compares
        # it against dist/dist-manifest.json.  A mismatch means the bundle and
        # the manifest are out of sync — rebuild with `npm run build` and
        # commit both files before tagging a release.
        run: node scripts/verify-dist-manifest.js

      - name: Verify license assets
        # SLSA provenance and the release checklist require the license files
        # to be present and shipped with the release.  Fail fast if they are
        # missing so we never publish a release without them.
        run: |
          test -f LICENSE
          test -f NOTICE
          test -f docs/LICENSE_REPORT.md || test -f docs/LICENSE_REPORT

      - name: Generate SLSA provenance
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/index.js
            dist/dist-manifest.json
            LICENSE
            NOTICE
            docs/LICENSE_REPORT.md

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v2.3.2
        with:
          generate_release_notes: true
          files: |
            LICENSE
            NOTICE
            docs/LICENSE_REPORT.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
