name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit || true

      # Issue #664 — the root tsconfig excludes __tests__ and only pulls in the
      # "node" types, so `npm run typecheck` never sees a test-only type error.
      # tsconfig.test.json covers src/ + __tests__ with jest types, so a broken
      # mock, fixture, or path alias fails the build here rather than at runtime.
      # No `|| true`: test-project type errors must fail the merge.
      - name: Typecheck (tests)
        run: npm run typecheck:tests

      - name: Test
        run: npx jest --maxWorkers=1 --no-coverage --forceExit || true
