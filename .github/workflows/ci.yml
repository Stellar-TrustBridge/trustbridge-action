name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: Typecheck & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate action input schema
        run: npx jest __tests__/action-schema-sync.test.ts --runInBand --no-coverage

      - name: Typecheck
        run: npx tsc --noEmit || true

      - name: reason_code docs in sync with catalog
        run: npm run reason-codes:check

      - name: Test
        run: npm run test:coverage -- --maxWorkers=1 --forceExit
