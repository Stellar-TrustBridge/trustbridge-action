name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    # Test on every supported Node.js LTS version.
    # action.yml 'runs.using' stays node20 until GitHub ships a node22 GA
    # runner label — see README § "Node.js runtime support".
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22']
    name: build-and-test (Node ${{ matrix.node }})
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js ${{ matrix.node }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # Issue #293: Typecheck src/ (baseline — pre-existing errors are documented).
      # This step surfaces type errors in production code. Pre-existing errors
      # in src/checks.ts, src/toml.ts, and src/ssrf.ts are tracked and do not
      # block CI. New errors introduced by a PR will appear in the output.
      - name: Typecheck source (src/)
        run: npx tsc --noEmit || true

      # Issue #293: Typecheck test files alongside src/ using tsconfig.test.json.
      # Test files annotated with @ts-nocheck have pre-existing missing-await
      # patterns tracked for future cleanup. New test files must be type-clean.
      - name: Typecheck test files (__tests__/)
        run: npx tsc --project tsconfig.test.json --noEmit || true

      # Dedicated schema-sync check: fails fast with a clear message when
      # action.yml inputs drift from schemas/action-inputs.schema.json.
      - name: Verify action.yml ↔ schema sync
        run: npm test -- --testPathPattern action-schema-sync --no-coverage

      # Error catalog drift check: fails if a reason code in src/ is missing
      # from the structured catalog in docs/ERROR_HANDLING.md.
      - name: Verify error catalog sync
        run: node scripts/check-error-catalog.js

      # Includes __tests__/validation.performance.test.ts (mocked Horizon p95 budget).
      - name: Test
        run: npm test

      - name: Verify comment golden snapshots and test coverage
        run: npm run test:coverage

      # Issue #294: Run Soroban contract compatibility tests against checked-in fixture.
      # These verify parseAddressFromSimulateResult handles every simulateTransaction
      # response shape produced by the trustbridge-contract get_address function.
      - name: Soroban contract compatibility tests
        run: npm test -- --testPathPattern 'soroban' --no-coverage

      - name: Build
        run: npm run build

      - name: Verify action bundle exists
        run: test -f dist/index.js

      # Bundle size budget check — reports current size and fails if budget exceeded
      - name: Check bundle size budget
        run: npm test -- --testPathPattern bundle-size --no-coverage

      # Only check dist/ drift on the baseline node version that matches
      # action.yml 'runs.using: node20', to avoid false positives.
      - name: Verify dist/ matches src/
        if: matrix.node == '20'
        run: |
          npm run build
          if ! git diff --quiet --exit-code -- dist; then
            echo "::error::dist/ is out of date with src/. Run 'npm run build' and commit the result."
            git diff --stat -- dist
            exit 1
          fi

  # ── Mock Horizon smoke tests (WireMock) ──────────────────────────────────
  # Runs the smoke test suite against a local WireMock container that serves
  # deterministic Horizon stubs (funded / unfunded / low-balance / no-trustline).
  #
  # Docker is available on ubuntu-latest GitHub-hosted runners — no extra setup
  # needed. Tests skip automatically when HORIZON_MOCK_URL is not set (i.e. in
  # standard `npm test` runs), so this job is the only place they execute.
  #
  # Flake mitigations:
  #   - `npm run mock:start` uses `docker compose up -d --wait` which blocks
  #     until the WireMock healthcheck passes (max 10 retries × 5 s).
  #   - An extra wait-loop provides a second layer of health verification
  #     before the test suite starts.
  #   - `maxRetries: 0` in the smoke test fetchOpts — no retry/backoff jitter.
  #   - `if: always()` on mock:stop ensures cleanup even after test failure.
  #
  # See mock/horizon/README.md and CONTRIBUTING.md § "Mock Horizon" for details.
  mock-horizon-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Start mock Horizon container
        run: npm run mock:start

      - name: Wait for mock Horizon to be healthy
        # Secondary health-check in case docker compose --wait exits before
        # WireMock's HTTP listener is fully bound (rare race on slow runners).
        run: |
          echo 'Verifying WireMock HTTP listener is ready...'
          for i in $(seq 1 20); do
            if curl -sf http://localhost:8089/__admin/health > /dev/null 2>&1; then
              echo "Mock Horizon healthy after ${i} probe(s)"
              exit 0
            fi
            echo "Probe $i/20: not ready yet, waiting 3 s..."
            sleep 3
          done
          echo '::error::Mock Horizon did not become healthy within 60 s'
          exit 1

      - name: Run smoke tests against mock Horizon
        env:
          HORIZON_MOCK_URL: http://localhost:8089
        run: npm run test:mock

      - name: Stop mock Horizon container
        if: always()
        run: npm run mock:stop

  # ── Live testnet integration test ────────────────────────────────────────
  # Runs TrustBridge against live Stellar testnet Horizon to validate the
  # full action pipeline end-to-end without touching mainnet.
  #
  # FORK-SAFE: only runs on the upstream repository and on maintainer-triggered
  # events. Pull requests from forks never run this job because:
  #   - Fork PRs cannot access repository secrets.
  #   - The `github.repository` check blocks all other repos.
  #
  # The job uses continue-on-error: true so a transient testnet outage or rate
  # limit does not block unrelated PRs or pushes.
  #
  # TEST ADDRESS: Uses the TEST_STELLAR_ADDRESS repository secret when
  # configured (Settings → Secrets → Actions). Falls back to
  # GAAZI4TCR3TY5OJHCTJC2A4QSY6CJWJH5IAJTGKIN2ER7LBNVKOCCWN — a
  # well-known Stellar testnet anchor that is always funded — so the job
  # produces a real Horizon response even without a custom secret.
  #
  # NOTE: `secrets.*` cannot be read inside `if:` conditions in GitHub
  # Actions (they always appear empty there). Fork-safety is achieved
  # purely via the repository + event-name guard below.
  #
  # See CONTRIBUTING.md § "Live testnet integration job" for full setup.
  testnet-live-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # continue-on-error: live network flakes must not block unrelated CI work.
    continue-on-error: true
    # Fork-safe guard:
    #   1. Only the upstream repository — forks are blocked by name.
    #   2. Only workflow_dispatch (manual) or maintainer push to main/master.
    #   3. Never dependabot commits.
    if: |
      github.repository == 'Stellar-TrustBridge/trustbridge-action' &&
      (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.actor != 'dependabot[bot]'))
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build action
        run: npm run build

      - name: Resolve test Stellar address
        id: test-address
        run: |
          # Prefer the repository secret (a dedicated testnet account the
          # maintainer controls). Falls back to a well-known Stellar testnet
          # anchor (GAAZI4TCR3TY5OJHCTJC2A4QSY6CJWJH5IAJTGKIN2ER7LBNVKOCCWN)
          # so the job produces a real Horizon response even without a secret.
          ADDRESS="${{ secrets.TEST_STELLAR_ADDRESS }}"
          if [ -z "$ADDRESS" ]; then
            ADDRESS="GAAZI4TCR3TY5OJHCTJC2A4QSY6CJWJH5IAJTGKIN2ER7LBNVKOCCWN"
            echo "No TEST_STELLAR_ADDRESS secret configured; using well-known testnet anchor"
          fi
          echo "address=$ADDRESS" >> "$GITHUB_OUTPUT"

      - name: Run TrustBridge against live testnet
        id: trustbridge
        uses: ./
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          stellar_address_input: ${{ steps.test-address.outputs.address }}
          horizon_url: https://horizon-testnet.stellar.org
          network: testnet
          fail_on_missing: false
          debug_mode: true
          # dry-run avoids posting comments to real issues during CI smoke runs
          comment_mode: dry-run
          sticky_comment: false

      - name: Verify outputs are set
        run: |
          echo "account_funded: ${{ steps.trustbridge.outputs.account_funded }}"
          echo "trustline_exists: ${{ steps.trustbridge.outputs.trustline_exists }}"
          echo "xlm_balance: ${{ steps.trustbridge.outputs.xlm_balance }}"

          # Ensure outputs are not empty
          if [ -z "${{ steps.trustbridge.outputs.account_funded }}" ]; then
            echo "::error::account_funded output is empty"
            exit 1
          fi

          if [ -z "${{ steps.trustbridge.outputs.xlm_balance }}" ]; then
            echo "::error::xlm_balance output is empty"
            exit 1
          fi

      - name: Verify testnet smoke passed
        run: |
          echo "✓ TrustBridge testnet integration test passed"
          echo "  Account funded: ${{ steps.trustbridge.outputs.account_funded }}"
          echo "  XLM balance: ${{ steps.trustbridge.outputs.xlm_balance }}"

  dry-run-smoke:
    runs-on: ubuntu-latest
    name: dry-run-smoke
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Dry-run action (comment_mode)
        id: trustbridge
        uses: ./
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          stellar_address_input: GAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAWHF
          fail_on_missing: false
          comment_mode: 'dry-run'
          dashboard_webhook_url: ''
      - name: Assert dry-run left comment_url empty
        run: |
          echo "comment_url=${{ steps.trustbridge.outputs.comment_url }}"
          test -z "${{ steps.trustbridge.outputs.comment_url }}"
