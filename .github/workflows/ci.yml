name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify action package
        run: |
          test -f action.yml
          test -f package.json
          test -f dist/index.js
          test -f README.md
          node -e "JSON.parse(require('fs').readFileSync('package.json','utf8'))"
          node -e "require('fs').readFileSync('action.yml','utf8')"
