name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify action package
        run: |
          test -f action.yml
          test -f package.json
          test -f dist/index.js
          test -f README.md
          node -e "JSON.parse(require('fs').readFileSync('package.json','utf8'))"
          node -e "require('fs').readFileSync('action.yml','utf8')"

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Lint
        run: npm run lint --if-present

  test-coverage:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Jest coverage gate (jest.config.js thresholds)
        run: npm run test:coverage

  license-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run license policy gate
        run: npm run license:check

  dist-drift:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck tests
        run: npm run typecheck:tests

      - name: Build and verify source-map quality
        run: |
          npm run build
          npm run test:map-paths

      - name: Verify dist is committed and deterministic
        run: |
          git diff --exit-code -- dist || {
            echo "dist drift detected. Rebuild on Linux / run refresh-dist."
            exit 1
          }

  bundle-size:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Enforce bundle-size budget
        run: npm run test:bundle-size

  verify-dist-manifest:
    name: verify-dist-manifest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify dist/index.js SHA-256 matches dist-manifest.json
        # Confirms the committed dist/dist-manifest.json is in sync with
        # the committed dist/index.js.  Fails the PR if the manifest is
        # missing or the digest does not match — rebuild and commit both.
        run: node scripts/verify-dist-manifest.js

  check-unpinned-actions:
    name: check-unpinned-actions
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check for unpinned action references
        run: bash scripts/check-unpinned-actions.sh .github/workflows docs/examples
