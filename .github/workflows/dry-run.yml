name: Dry-Run Smoke Test

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dry-run-validation:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        test-case:
          - name: "Valid funded account (public)"
            address: "GA5ZSEJYB37JRC5AVCIA5MOP4RHTM335X2KGX3IHOJAPP5RE34K4KZVN"
            horizon: "https://horizon.stellar.org"
            asset_code: "USDC"
            asset_issuer: "GA5ZSEJYB37JRC5AVCIA5MOP4RHTM335X2KGX3IHOJAPP5RE34K4KZVN"
            expected_funded: "true"
          - name: "Unfunded account (testnet)"
            address: "GAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAWHF"
            horizon: "https://horizon-testnet.stellar.org"
            asset_code: "USDC"
            asset_issuer: "GBBD47IF6LWK7P7MDEVSCWR7DPUWV3NY3DTQEVFL4NAT4AQH3ZLLFLA5"
            expected_funded: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build action
        run: npm run build

      - name: Run dry-run test - ${{ matrix.test-case.name }}
        id: trustbridge
        uses: ./
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          stellar_address_input: ${{ matrix.test-case.address }}
          horizon_url: ${{ matrix.test-case.horizon }}
          asset_code: ${{ matrix.test-case.asset_code }}
          asset_issuer: ${{ matrix.test-case.asset_issuer }}
          min_xlm_reserve: '1.5'
          fail_on_missing: false
          comment_mode: 'dry-run'
          debug_mode: true

      - name: Verify outputs are set
        run: |
          echo "account_funded=${{ steps.trustbridge.outputs.account_funded }}"
          echo "trustline_exists=${{ steps.trustbridge.outputs.trustline_exists }}"
          echo "xlm_balance=${{ steps.trustbridge.outputs.xlm_balance }}"
          echo "comment_url=${{ steps.trustbridge.outputs.comment_url }}"

          if [ -z "${{ steps.trustbridge.outputs.account_funded }}" ]; then
            echo "::error::account_funded output was not set"
            exit 1
          fi

          if [ "${{ steps.trustbridge.outputs.account_funded }}" != "${{ matrix.test-case.expected_funded }}" ]; then
            echo "::warning::account_funded mismatch: expected ${{ matrix.test-case.expected_funded }}, got ${{ steps.trustbridge.outputs.account_funded }}"
          fi

      - name: Verify comment_url is empty in dry-run
        run: |
          if [ -n "${{ steps.trustbridge.outputs.comment_url }}" ]; then
            echo "::error::comment_url should be empty in dry-run mode but got: ${{ steps.trustbridge.outputs.comment_url }}"
            exit 1
          fi
          echo "✓ comment_url is empty as expected in dry-run mode"

  dry-run-with-webhook:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build action
        run: npm run build

      - name: Start mock webhook server
        run: |
          node -e "
          const http = require('http');
          const server = http.createServer((req, res) => {
            let body = '';
            req.on('data', chunk => body += chunk);
            req.on('end', () => {
              console.log('Webhook received:', body);
              res.writeHead(200);
              res.end('OK');
            });
          });
          server.listen(8080);
          console.log('Mock webhook listening on :8080');
          " &
          sleep 2

      - name: Run dry-run with webhook
        id: trustbridge_webhook
        uses: ./
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          stellar_address_input: "GA5ZSEJYB37JRC5AVCIA5MOP4RHTM335X2KGX3IHOJAPP5RE34K4KZVN"
          horizon_url: "https://horizon.stellar.org"
          asset_code: "USDC"
          asset_issuer: "GA5ZSEJYB37JRC5AVCIA5MOP4RHTM335X2KGX3IHOJAPP5RE34K4KZVN"
          comment_mode: 'dry-run'
          dashboard_webhook_url: "http://localhost:8080/webhook"
          fail_on_missing: false
          debug_mode: true

      - name: Verify webhook was called
        run: echo "✓ Dry-run with webhook completed"

