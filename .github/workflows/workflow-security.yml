name: Workflow Security

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/**"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate workflow YAML
        run: |
          python3 - <<'PY'
          import pathlib
          import sys

          try:
              import yaml
          except ImportError:
              import subprocess
              subprocess.check_call([sys.executable, "-m", "pip", "install", "--quiet", "pyyaml"])
              import yaml

          errors = []
          for path in sorted(pathlib.Path(".github/workflows").glob("*.yml")):
              try:
                  with path.open() as fh:
                      yaml.safe_load(fh)
              except Exception as exc:  # noqa: BLE001
                  errors.append(f"{path}: {exc}")

          if errors:
              print("\n".join(errors))
              sys.exit(1)
          print(f"Validated {len(list(pathlib.Path('.github/workflows').glob('*.yml')))} workflow files")
          PY
