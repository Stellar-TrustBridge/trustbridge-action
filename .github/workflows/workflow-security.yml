name: Workflow Security

# Runs zizmor static analysis on workflow files to catch credential-exfiltration
# patterns, unpinned action references, and other security anti-patterns before
# they are merged. Triggered on any push or PR that touches workflow files.
#
# Related issues:
#   #661 — CI: run zizmor workflow security scan on workflow changes
#   #555 — Add root .actionlint.yaml for example-workflow suppressions
#
# Configuration:
#   .github/zizmor.yml  — suppression rules for known-safe patterns
#   .actionlint.yaml    — actionlint suppression rules (root of repo)

on:
  push:
    branches: [main, master]
    paths:
      - '.github/workflows/**'
      - '.github/zizmor.yml'
      - '.actionlint.yaml'
  pull_request:
    branches: [main, master]
    paths:
      - '.github/workflows/**'
      - '.github/zizmor.yml'
      - '.actionlint.yaml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  zizmor:
    name: zizmor workflow security scan
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false

      - name: Run zizmor 🌈
        uses: zizmorcore/zizmor-action@85b2b9fb8e3325e7a23d7d0a9d7ba5ae0f999e3e  # v0.7.1
        with:
          # Scan all workflow files in .github/workflows/
          inputs: .github/workflows/
          # Load repository suppression rules
          config: .github/zizmor.yml
          # Do not require GitHub Advanced Security — works on any public repo
          advanced-security: false
          # Fail the job when zizmor finds unsuppressed issues
          # (annotations mode is incompatible with advanced-security: false)
          annotations: false
          # Minimum severity to report (low|medium|high|critical)
          min-severity: medium
          # Minimum confidence to report (low|medium|high)
          min-confidence: medium
