name: "TrustBridge Action"
description: >-
  Verify that a Stellar account is funded, holds a trustline for a specified
  asset (default USDC), and meets the minimum XLM reserve before continuing
  GitHub issue workflows.
author: "Stellar-TrustBridge"
branding:
  icon: "shield"
  color: "blue"

# Breaking-change policy for inputs and outputs: docs/BREAKING_CHANGES.md
inputs:
  max_retries:
    description: "Maximum number of retry attempts for Horizon API requests"
    required: false
    default: "3"
  retry_base_delay_ms:
    description: "Base delay in milliseconds for exponential backoff"
    required: false
    default: "1000"
  horizon_url:
    description: "Stellar Horizon API base URL"
    required: false
    default: "https://horizon.stellar.org"
  asset_code:
    description: "Asset code to check trustline for"
    required: false
    default: "USDC"
  asset_issuer:
    description: 'Asset issuer Stellar address (G-address or Soroban contract C-address)'
    required: false
    default: "GA5ZSEJYB37JRC5AVCIA5MOP4RHTM335X2KGX3IHOJAPP5RE34K4KZVN"
  min_xlm_reserve:
    description: "Minimum native XLM balance required (string, e.g. 1.5)"
    required: false
    default: "1.5"
  min_trustline_limit:
    description: >-
      Minimum trustline limit required for the configured asset (numeric, e.g. 100).
      When set, the action will warn or fail if the account's trustline limit is below
      this threshold. Leave empty to skip this check. (Issue #140)
    required: false
    default: ""
  min_asset_balance:
    description: >-
      Minimum balance required for the configured asset (numeric string, e.g. 100).
      When set, the action will warn or fail if the account's asset balance is below
      this threshold. Leave empty to skip this check. (Issue #112)
    required: false
    default: ""
  stellar_address_input:
    description: >-
      Stellar destination address (G-address or Soroban contract C-address)
      to validate. Required unless assignee_address_map is set, in which case
      the address is resolved from the map using the GitHub assignee login.
      C-address destinations are checked via Soroban RPC and skip Horizon
      account/trustline balance checks.
    required: false
    default: ""
  assignee_address_map:
    description: >-
      Optional JSON object (or path to a JSON file) mapping GitHub usernames
      (assignees) to Stellar G-addresses. When set, TrustBridge resolves the
      assignee login from the GitHub event context and looks up their address
      before calling Horizon — so assignment workflows do not need to parse
      the issue body. Example: '{"alice":"G...","bob":"G..."}' or
      'rosters/wallets.json'. Do not commit private rosters to public repos;
      prefer org/repo secrets or a private path.
    required: false
    default: ""
  fail_on_missing:
    description: "Fail the workflow step when checks do not pass (true) or only warn (false)"
    required: false
    default: 'true'
  preflight_only:
    description: >-
      Run only the issues:write preflight check and exit before any Horizon
      calls. Useful when verifying token permissions or setting up a new
      workflow. Default false.
    required: false
    default: 'false'
  issue_number:
    description: >-
      Explicit issue or pull request number to comment on. Use this for
      reusable workflows or workflow_dispatch runs that need to post results
      without trusting event payload text. Leave empty to resolve from the
      GitHub event context (`issues`, `pull_request`, or `pull_request_target`).
    required: false
    default: ''
  debug_mode:
    description: "Enable extra action logs for troubleshooting"
    required: false
    default: "false"
  horizon_timeout_ms:
    description: "Horizon request timeout in milliseconds (1000-60000)"
    required: false
    default: "15000"
  sticky_comment:
    description: >-
      Update TrustBridge's previous comment on the issue instead of posting a
      new one each run (true), or always post a new comment (false)
    required: false
    default: 'true'
  comment_mode:
    description: >-
      Controls the comment threading strategy. One of: 'sticky' (default —
      updates TrustBridge's previous comment in place, equivalent to
      sticky_comment:true), 'new' (always posts a new comment for a full audit
      trail — equivalent to sticky_comment:false), or 'reply' (posts a reply
      to the first TrustBridge bot comment in the thread rather than updating
      it, creating a chronological reply chain). When set, comment_mode takes
      precedence over the sticky_comment input.
    required: false
    default: 'sticky'
  wait_until_funded:
    description: >-
      Poll Horizon until the account becomes funded (true) instead of
      immediately returning an unfunded result on the first 404 (false)
    required: false
    default: "false"
  wait_until_funded_timeout_ms:
    description: >-
      Maximum total time to poll for the account to become funded, in
      milliseconds (0-600000). Only used when wait_until_funded is true.
    required: false
    default: "120000"
  wait_until_funded_interval_ms:
    description: >-
      Delay between funded-account polling attempts, in milliseconds
      (1000-60000). Only used when wait_until_funded is true.
    required: false
    default: "5000"
  horizon_url_fallback:
    description: >-
      Optional fallback Horizon API base URL. When the primary Horizon URL
      fails with a non-404 retryable error, the action transparently retries
      against this URL before giving up. Useful for cross-region or
      multi-provider resilience.
    required: false
    default: ""
  horizon_cache_ttl_ms:
    description: >-
      Time-to-live for the in-memory Horizon account cache, in milliseconds.
      Set to 0 to disable caching entirely. Default 60000 (60 seconds).
    required: false
    default: "60000"
  rpc_fallback_url:
    description: "Optional secondary/fallback Horizon or RPC URL if primary fails"
    required: false
    default: ""
  horizon_max_requests:
    description: "Global cap on Horizon requests per run to prevent 429 stampedes (0 for unlimited)"
    required: false
    default: "0"
  retry_max_delay_ms:
    description: "Maximum backoff delay in milliseconds for Horizon retries"
    required: false
    default: "30000"
  use_cache:
    description: "Cache successful Horizon responses in job memory (true/false)"
    required: false
    default: "false"
  use_actions_cache_backend:
    description: >-
      Enable GitHub Actions cache backend persistence (true/false) to share
      cached Horizon responses across matrix legs and subsequent workflow runs.
      When enabled, cached data is persisted to GitHub Actions' cache backend
      with TTL respected. TTL violations and poisoning is prevented by
      validating account state on cache hits. Defaults to false for
      backward compatibility.
    required: false
    default: "false"
  allow_cross_network_fallback:
    description: >-
      By default, the fallback URL (`horizon_url_fallback`/`rpc_fallback_url`)
      is only used when it resolves to the same Stellar network (public vs
      testnet, inferred from the URL) as `horizon_url` — a G-address is valid
      on every network, so a mismatched fallback could otherwise silently
      return funded/trustline/reserve data for the wrong ledger. Set this to
      `true` to opt into cross-network fallback anyway. Defaults to false.
    required: false
    default: "false"
  log_inputs:
    description: >-
      Emit a structured JSON log record of all resolved action inputs at run
      start (redacted — Stellar addresses, Horizon URLs, and any embedded
      secrets are masked before the record is written to GitHub Actions log
      output). Useful for auditing which inputs were active during a run.
      Defaults to false.
    required: false
    default: "false"
  trustbridge_config_path:
    description: >-
      Path (relative to the repository root, or absolute) to a consumer
      trustbridge.yml config file that can supply default values for
      horizon_url, asset_code, asset_issuer, min_xlm_reserve, and other
      inputs.  Explicit action inputs always override values from the file.
      The file is validated for SSRF-safe URLs, injection-clean strings, and
      secret field redaction before any value is used.  Defaults to
      ".trustbridge.yml" in the repository root.  Leave empty to skip the
      config file entirely.
    required: false
    default: ".trustbridge.yml"
  milestone_allowlist:
    description: >-
      Comma-separated list of allowed milestone names. When set, runs will skip
      validation unless the issue/PR milestone matches one of these values. Useful
      for repo-level workflow gates.
    required: false
    default: ""
  milestone_fail_on_skip:
    description: >-
      When true and the milestone gate skips validation, fail the workflow step
      instead of only logging a warning. Default false.
    required: false
    default: "false"
  github_token:
    description: >-
      GitHub token used to post issue comments. Requires `issues: write`
      permission on the repository. `GITHUB_TOKEN` with `permissions:
      issues: write` is sufficient for issue-triggered runs on the default
      branch and on non-fork pull requests. For fork pull requests, org-level
      token restrictions, or GitHub Enterprise Server, you may need a
      fine-grained PAT or a GitHub App token with the Issues (read and write)
      permission. For `discussion` events, the comment is posted via GraphQL
      and requires `discussions: write` instead of `issues: write` (Issue
      #221). Omit or leave empty when running in a context where comment
      posting is not required (outputs are still set).
    required: true
  github_app_token:
    description: >-
      Optional pre-minted GitHub App installation token (e.g. from
      actions/create-github-app-token) used instead of GITHUB_TOKEN for
      organization-wide triage workflows or cross-repository comments.
      When provided, takes precedence over github_token. (Issue #225)
    required: false
    default: ""
  assets_json:
    description: >-
      JSON array of additional assets to validate trustlines for, e.g.
      [{"code":"USDC","issuer":"GA5Z..."},{"code":"EURC","issuer":"GCQT..."}].
      When provided, trustline checks are run for every listed asset in
      addition to (or instead of) the single asset_code/asset_issuer pair.
      Duplicate entries are silently deduplicated. Results are exposed via
      the `assets_trustline_status` and `trustlines_summary` outputs and
      rendered as a per-asset breakdown in the issue comment.
    required: false
    default: ""
  sep0007_deep_links:
    description: >-
      When true, embed SEP-0007 wallet deep links in the issue comment for
      funding and trustline setup. Default false.
    required: false
    default: "false"
  auto_wallet_labels:
    description: >-
      Automatically apply a wallet state label to the issue
      (wallet: funded | wallet: unfunded | wallet: trustline-missing |
      wallet: reserve-low | wallet: horizon-error). Requires
      `issues: write` permission. Default false.
    required: false
    default: "false"
  pass_label:
    description: >-
      Optional label name to apply when the TrustBridge check passes. Leave empty to disable.
      Useful for boards or labels that represent a ready state distinct from auto_wallet_labels.
    required: false
    default: ""
  fail_label:
    description: >-
      Optional label name to apply when the TrustBridge check fails. Leave empty to disable.
      Useful for boards or labels that represent a not-ready state distinct from auto_wallet_labels.
    required: false
    default: ""
  sep0007_origin_domain:
    description: >-
      Optional origin domain embedded in SEP-0007 URIs for wallet validation
      (SEP-0007 §3.4). Leave empty to omit the field.
    required: false
    default: ""
  snooze_window_minutes:
    description: >-
      Time window (in minutes) to suppress duplicate validation failure comments
      on the same issue. When a check fails and the last check also failed
      within this window, the comment update is suppressed to reduce notification
      noise. Outputs are always updated even when snoozed. Set to 0 to disable
      snoozing (always post). Default 30 minutes. (Issue #155)
    required: false
    default: "30"
  force_comment:
    description: >-
      Bypass snooze logic and force an immediate comment post, even if within
      the snooze window. Useful for maintainers who want to re-alert after
      a fix attempt. Default false. (Issue #155)
    required: false
    default: "false"
  webhook_url:
    description: >-
      Optional HTTPS URL to POST a signed webhook notification to after every
      validation run. When empty (default) no webhook is sent and comment
      posting is completely unaffected. The payload is signed with
      HMAC-SHA256 when `webhook_secret` is also supplied. Disabled by default.
      (Issue #101)
    required: false
    default: ""
  webhook_secret:
    description: >-
      Shared secret used to sign the webhook payload with HMAC-SHA256. The
      signature is included as the `X-TrustBridge-Signature` HTTP header in
      the format `sha256=<hex-digest>`. Never logged or embedded in comments.
      Leave empty to send unsigned webhooks (not recommended for production).
      Only used when `webhook_url` is set. (Issue #101)
    required: false
    default: ""
  webhook_timeout_ms:
    description: >-
      Maximum time in milliseconds to wait for the webhook endpoint to
      respond. When the timeout elapses the request is aborted and a warning
      is logged — comment posting and validation results are unaffected.
      Default 5000 (5 seconds). (Issue #101)
    required: false
    default: "5000"
  webhook_auth_mode:
    description: >-
      Authentication mechanism for dashboard webhook notifications: "hmac" (default)
      using HMAC-SHA256 signature with webhook_secret, or "oidc" to mint a GitHub OIDC
      ID token and send as `Authorization: Bearer <token>`. Requires `id-token: write`
      permission when set to "oidc". (Issue #224)
    required: false
    default: "hmac"
  webhook_oidc_audience:
    description: >-
      Expected audience for GitHub OIDC token when webhook_auth_mode is "oidc".
      Default "trustbridge-dashboard". (Issue #224)
    required: false
    default: "trustbridge-dashboard"
  docs_base_url:
    description: >-
      Optional base URL for FAQ/docs deep links embedded in failing check
      bullets. Defaults to this repository's `docs/FAQ.md`. Override for
      forks or mirrors that host their own documentation. Must be an HTTPS
      URL; invalid values fall back to the default silently. (Issue #104)
    required: false
    default: ""
  network:
    description: >-
      Stellar network shorthand: "testnet", "public", or "mainnet". When set
      (and "preset" is empty), the matching campaign preset overrides
      horizon_url, asset_code, and asset_issuer defaults. Explicit action
      inputs always win over preset values. (Issue #207)
    required: false
    default: ""
  preset:
    description: >-
      Campaign preset name (e.g. "testnet", "public", "testnet-usdc",
      "mainnet"). When set, overrides horizon_url, asset_code, and
      asset_issuer defaults. Takes precedence over the "network" input.
      Explicit action inputs always win. (Issue #207)
    required: false
    default: ""

  comment_mode:
    description: >-
      Controls whether TrustBridge posts an issue comment: "post" (default)
      writes/updates the sticky comment, "dry-run" builds the comment but does
      not call the GitHub API, and "off" skips comment generation entirely.
      Outputs are always set regardless of mode.
    required: false
    default: 'post'
  fixture_mode:
    description: >-
      When true, load the Horizon account response from a local JSON file
      (fixture_path) instead of calling the live Horizon API. No network
      call is made. Intended for offline development, comment formatting
      iteration, and CI runs that do not need a live Horizon endpoint.
      SSRF validation is still applied to horizon_url when fixture_mode is
      false (the default). Default false.
    required: false
    default: 'false'
  fixture_path:
    description: >-
      Path to a Horizon account JSON fixture file, relative to the
      repository root (GITHUB_WORKSPACE). Only used when fixture_mode is
      true. A path-traversal guard prevents escaping outside the workspace.
      Example: "fixtures/account-funded.json". Default empty.
    required: false
    default: ''
  dashboard_webhook_url:
    description: >-
      Optional dashboard webhook URL (alias / Wave #38 harness input). When set,
      TrustBridge POSTs a signed notification after every validation run.
      Prefer webhook_url for production; this input remains for dry-run smoke
      tests and backwards-compatible workflows.
    required: false
    default: ''
  onboarding_checklist:
    description: >-
      Include an onboarding checklist task list in the issue comment whose
      checkboxes reflect live ValidationResult state. Default true.
    required: false
    default: "true"
  check_ledger_freshness:
    description: >-
      When true, query Horizon root for ledger lag before account checks and
      surface a freshness banner in the comment. Default false.
    required: false
    default: "false"
  max_ledger_lag_seconds:
    description: >-
      Maximum acceptable Horizon ledger lag in seconds when check_ledger_freshness
      is enabled. Default 60.
    required: false
    default: "60"
  ledger_freshness_fail_on_stale:
    description: >-
      When true and ledger freshness is stale, treat the run as invalid.
      Default false (warn only).
    required: false
    default: "false"
  network_passphrase:
    description: >-
      Optional Stellar network passphrase override used for diagnostics and
      SEP-0007 deep links. Leave empty to infer from horizon_url.
    required: false
    default: ""
  home_domain_check_enabled:
    description: >-
      Enable SEP-0001 home_domain alignment check against the asset issuer
      account. Default false.
    required: false
    default: "false"
  expected_home_domain:
    description: >-
      Expected issuer home_domain value when home_domain_check_enabled is true.
      Leave empty to accept any non-empty on-chain home_domain.
    required: false
    default: ""
  home_domain_check_mode:
    description: >-
      How to treat home_domain mismatches: "warn" (default) or "strict"
      (blocks valid).
    required: false
    default: "warn"
  stellar_toml_fetch_enabled:
    description: >-
      Enable optional SEP-0001 stellar.toml fetch and validation when
      home_domain_check_enabled is true. Fetches the TOML file at
      https://{home_domain}/.well-known/stellar.toml with SSRF protection
      and TTL caching. Default false.
    required: false
    default: "false"
  stellar_toml_cache_ttl_ms:
    description: >-
      Time-to-live for stellar.toml fetch cache in milliseconds. Default 3600000
      (1 hour). Only used when stellar_toml_fetch_enabled is true.
    required: false
    default: "3600000"
  stellar_toml_hash_pin:
    description: >-
      Optional integrity hash for stellar.toml content validation. Format:
      "algorithm:hexvalue" (e.g. "sha256:abc123..."). When set, the fetched TOML
      content is hashed and compared; a mismatch fails the check. Protects against
      cache poisoning and MITM attacks. Only used when stellar_toml_fetch_enabled
      is true.
    required: false
    default: ""
  write_validation_json:
    description: >-
      When true, write the validation result to validation_json_path as a
      machine-readable JSON artifact. Includes all check results, account
      state, and metadata. Default false.
    required: false
    default: "false"
  validation_json_path:
    description: >-
      File path where the validation result JSON is written when
      write_validation_json is true. Relative paths are resolved from the
      workflow workspace. Default "validation.json".
    required: false
    default: "validation.json"
  trustbridge_plugins_path:
    description: >-
      Comma-separated list of workspace-relative paths to external CheckPlugin
      modules to load and register (e.g. "plugins/kyc.ts,plugins/custom-check.ts").
      Plugins are loaded from the workspace only and must be allowlisted here.
      Each path is validated against path-traversal attacks. Default empty (no
      external plugins). When a plugin fails to load, a warning is logged and
      the run continues (fail-open).
    required: false
    default: ""

  sarif_output_path:
    description: >-
      Path to write SARIF 2.1.0 output file for GitHub Advanced Security
      integration. Leave empty to skip SARIF output. The file is written
      under GITHUB_WORKSPACE. (Issue #197)
    required: false
    default: ""

  use_plugin_runner:
    description: >-
      Use the plugin-based check pipeline (runPlugins + core plugins)
      instead of the monolith runAccountChecks. Default false. (Issue #198)
    required: false
    default: "false"

  locale:
    description: >-
      Language for issue comments. Supported values: en (English, default),
      es (Spanish), pt (Portuguese), ja (Japanese), fr (French), de (German).
      Invalid or unsupported locales fall back to English. (Issue #202, #313)
    required: false
    default: "en"

  stellar_addresses:
    description: >-
      Newline-separated list or JSON array of Stellar addresses for batch
      validation. When set, validates all addresses and posts a batch
      summary comment. Single-address jobs should use
      stellar_address_input instead. (Issue #199)
    required: false
    default: ""

  unassign_on_not_ready:
    description: >-
      Automatically unassign the GitHub assignee(s) when readiness checks fail
      (ready is false). Defaults to false (opt-in policy). Requires `issues: write`
      permission. Permission or API errors are logged as warnings and do not fail the run.
      Does not unassign during Horizon network/connectivity outages. (Issue #228)
    required: false
    default: "false"

  project_id:
    description: >-
      Optional GitHub Projects v2 ID (node ID e.g. PVT_...) to update item status
      when validation passes or fails. (Issue #222)
    required: false
    default: ""

  project_status_field:
    description: >-
      Name of the status field in the GitHub Projects v2 board. Default "Status". (Issue #222)
    required: false
    default: "Status"

  project_status_pass:
    description: >-
      Value/option to set on the project status field when validation passes. (Issue #222)
    required: false
    default: ""

  project_status_fail:
    description: >-
      Value/option to set on the project status field when validation fails. (Issue #222)
    required: false
    default: ""

  project_token:
    description: >-
      Optional GitHub token with `project` or `write:org` scope if different from github_token. (Issue #222)
    required: false
    default: ""

  claimable_balance_policy:
    description: >-
      How to treat claimable balances when determining funded status (Issue #260):
      "ignore" (default) — funded means Horizon account exists; claimable balances do not affect funded/ready and no extra Horizon request is made;
      "count" — when account is 404, also checks claimable_balances claimant endpoint and surfaces claimable presence in the comment (informational, does not auto-claim).
      Empty claimables are treated as no hint in either mode. Default "ignore" matches today’s behavior.
    required: false
    default: "ignore"

  sep0010_challenge_xdr:
    description: >-
      Optional base64 XDR of a SEP-0010 challenge transaction to display in the comment (Issue #252).
      When set, the comment includes a truncated challenge snippet for Freighter signing. Prefer `sep0010_dashboard_url` to avoid leaking nonces.
      Does not block `ready` unless your workflow explicitly gates on it.
    required: false
    default: ""

  sep0010_dashboard_url:
    description: >-
      Optional HTTPS dashboard URL where Freighter SEP-0010 proof can be verified (Issue #252).
      When set, the comment shows a "Verify with Freighter on dashboard" link instead of a raw XDR snippet. Preferred over `sep0010_challenge_xdr`.
      Must be https and not a private/loopback host. Does not block `ready` unless documented.
    required: false
    default: ""

  unauthorized_trustline_policy:
    description: >-
      How to treat a trustline that exists but is not yet authorized by the issuer
      (AUTHORIZATION_REQUIRED): "warn" (default, surfaces warning), "fail" (blocks ready),
      or "ignore" (skips check). (Issue #247)
    required: false
    default: 'warn'

  clawback_strict_mode:
    description: >-
      When true, fail validation if the configured asset has clawback enabled
      (is_clawback_enabled / AUTH_CLAWBACK_ENABLED). When false (default), surfaces
      an informational notice without failing the run. (Issue #247)
    required: false
    default: 'false'

  skip_for_maintainers:
    description: >-
      Opt-in skip of validation checks when the workflow actor is a maintainer
      (listed in CODEOWNERS or maintainers_allowlist). Defaults to false. (Issue #241)
    required: false
    default: 'false'

  skip_if_maintainer:
    description: >-
      Alias for skip_for_maintainers. Opt-in skip when actor is a maintainer. Defaults to false. (Issue #241)
    required: false
    default: 'false'

  maintainers_allowlist:
    description: >-
      Optional comma-separated list of GitHub usernames or teams to treat as maintainers
      when skip_for_maintainers is true. (Issue #241)
    required: false
    default: ''
  horizon_pin_fingerprint:
    description: >-
      Optional TLS certificate fingerprint (SHA-256, colon-separated hex, e.g.
      AA:BB:CC:...:FF) to pin the Horizon endpoint certificate against.
      When set, TrustBridge performs a pre-flight TLS probe to the horizon_url
      host and compares the server certificate fingerprint. A mismatch fails
      the action immediately with a clear error. Default empty (pinning disabled).
      WARNING: Pin rotation will break your workflow until you update this value.
      Do not pin in shared public workflow examples. (Issue #303)
    required: false
    default: ""

  federation_resolution_enabled:
    description: >-
      Enable optional federation (user*domain) address resolution. When true,
      addresses in "user*domain" format are resolved via HTTPS stellar.toml
      federation protocol. Default false. (Issue #257)
    required: false
    default: 'false'

  horizon_url_allowlist:
    description: >-
      Optional comma-separated list of allowed Horizon base URLs.
      When set, any configured Horizon URL must strictly match one of these allowed
      hosts, in addition to passing the existing SSRF block-list checks.
    required: false
    default: ''

  dashboard_roster_url:
    description: >-
      Optional dashboard API URL to fetch the assignee roster via HTTP GET.
      When configured, this overrides the local assignee_address_map.
    required: false
    default: ''

  dashboard_roster_secret:
    description: >-
      Optional secret key used to generate the X-TrustBridge-Signature HMAC for dashboard requests.
    required: false
    default: ''

  dashboard_roster_timeout_ms:
    description: 'Dashboard HTTP request timeout in milliseconds (1000-60000)'
    required: false
    default: '5000'

  soroban_full_roster:
    description: >-
      If true, retrieves the complete assignee roster from the Soroban contract using pagination.
      Defaults to false (single lookup).
    required: false
    default: 'false'

  soroban_roster_page_limit:
    description: 'Maximum number of pages to fetch when soroban_full_roster is true'
    required: false
    default: '10'

  custom_comment_template_path:
    description: >-
      Optional workspace-relative (or absolute within the workspace) path to a
      Markdown partial file appended to the TrustBridge issue comment just
      before the footer (#312). Useful for adding Wave-specific help,
      campaign links, or org-specific remediation guidance without forking
      the action.

      The partial supports {{variable}} interpolation for safe substitution:
        - {{account}}       -- checked Stellar address
        - {{asset}}         -- asset code (e.g. USDC)
        - {{issuer}}        -- asset issuer address
        - {{network}}       -- inferred network (mainnet / testnet / unknown)
        - {{horizon}}       -- Horizon base URL
        - {{status}}        -- ready or blocked with emoji
        - {{locale:KEY}}    -- i18n string for KEY in the active locale

      All substituted values (except status) are escaped with
      escapeMarkdownInline to prevent Markdown injection. Dangerous
      patterns (<script>, javascript:, inline event handlers,
      {{constructor}}, {{__proto__}}) are rejected before
      interpolation. The file must reside inside the workspace root (path
      traversal is blocked) and must not exceed 8 KB. Leave empty to
      disable this feature entirely.
    required: false
    default: ''

outputs:
  # ── Legacy outputs (kept for backward compatibility) ──────────────────────
  trustline_exists:
    description: "Whether the account has a trustline for the configured asset"
  xlm_balance:
    description: "Current native XLM balance as reported by Horizon"
  account_funded:
    description: "Whether the account exists and is activated on the Stellar network"
  comment_url:
    description: "URL of the created or updated issue comment, when run in an issue context"
  full_report_path:
    description: >-
      Absolute path of the full validation report file written to the workflow
      workspace when the comment body exceeded GitHub's size limit.  Empty
      when the comment was within the limit and no file was written.

  # ── Audit & Integration outputs (Issue #66, #67) ─────────────────────────
  ready:
    description: "Whether all validation checks passed (true/false)"
  validated_at:
    description: "ISO-8601 timestamp when the validation checks were performed"
  horizon_url:
    description: "Horizon API base URL used for validation"
  asset_code:
    description: "Asset code validated by the action"
  asset_issuer:
    description: "Asset issuer address validated by the action"
  reason_code:
    description: "Machine-readable failure reason code (e.g. SUCCESS, ACCOUNT_NOT_FUNDED, TRUSTLINE_MISSING, RESERVE_TOO_LOW)"
  checks_json:
    description: "JSON string array of individual check results and pass/fail statuses"

  # ── Badge outputs (Issue #TBD) ────────────────────────────────────────────
  badge_markdown:
    description: "Markdown-formatted badge snippet (e.g. for README embeds) linking to TrustBridge repo"
  badge_url:
    description: "Shields.io badge URL reflecting validation state (pass/fail/pending)"

  # ── Split balance outputs (Issue #246) ─────────────────────────────────────
  asset_balance:
    description: "Current configured asset (e.g. USDC) balance as reported by Horizon (7-decimal string, 0 if no trustline, unknown on Horizon error)"
  native_balance:
    description: "Native XLM balance alias of xlm_balance (7-decimal Horizon string)"

  # ── Timing breakdown outputs (Issue #93) ──────────────────────────────────
  timings_json:
    description: "JSON string containing millisecond execution timings for all major phases"
  timing_input_parse_ms:
    description: "Execution duration of input parsing phase in milliseconds"
  timing_horizon_fetch_ms:
    description: "Execution duration of Horizon API fetch phase in milliseconds"
  timing_checks_ms:
    description: "Execution duration of validation checks phase in milliseconds"
  timing_comment_post_ms:
    description: "Execution duration of comment posting phase in milliseconds"
  timing_total_ms:
    description: 'Total execution duration in milliseconds'
  num_sponsoring:
    description: 'Number of accounts this account is sponsoring (numeric string)'
  num_sponsored:
    description: 'Number of accounts sponsoring this account (numeric string)'

runs:
  using: "node20"
  main: "dist/index.js"
